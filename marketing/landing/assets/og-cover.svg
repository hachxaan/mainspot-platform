<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#faf8f5"/><circle cx="1030" cy="110" r="300" fill="#f4dce9"/><circle cx="1010" cy="500" r="200" fill="#f5d58e"/><g fill="#d3006b"><circle cx="98" cy="94" r="21"/><circle cx="147" cy="94" r="21"/><circle cx="98" cy="143" r="21"/><circle cx="147" cy="143" r="21"/></g><text x="200" y="137" font-family="Arial,sans-serif" font-size="58" font-weight="800" fill="#251a33">mainspot.</text><text x="90" y="330" font-family="Arial,sans-serif" font-size="74" font-weight="800" fill="#251a33">Tu negocio, en todas partes.</text><text x="92" y="429" font-family="Arial,sans-serif" font-size="48" fill="#d3006b">Sin que tengas que estar en todo.</text><text x="94" y="555" font-family="Arial,sans-serif" font-size="25" fill="#615773">Para los que hacen que su negocio suceda.</text></svg>