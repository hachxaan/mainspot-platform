# MainSpot platform — local pilot environment (INC-001)
# Dev-only defaults; override via .env (never commit a real .env).
# Aislamiento LÓGICO por cliente (DEC-018): una BD compartida con tenant_id +
# contexto + fail-closed; sin Docker/LXC por cliente.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mainspot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mainspot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mainspot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mainspot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mainspot} -d ${POSTGRES_DB:-mainspot}"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # APP_ENV stays 'development' for the pilot.
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-mainspot}:${POSTGRES_PASSWORD:-mainspot_dev_password}@postgres:5432/${POSTGRES_DB:-mainspot}
      # IR-02: NO default secret. The app container refuses to start without a
      # JWT_SECRET from the environment (see .env.example). Intentionally empty
      # here so `docker compose up -d postgres` keeps working for local dev DB.
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUDIT_MODE: ${AUDIT_MODE:-fail_closed}
      # INC-002/INC-003 (DEC-016/019/026): canal + proveedor de dominios.
      # Sin TELEGRAM_BOT_TOKEN / HOSTINGER_API_TOKEN el sistema usa el modo
      # simulado funcional (E2E/piloto sin credenciales externas).
      CHANNEL_PRIMARY: ${CHANNEL_PRIMARY:-simulated}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DOMAIN_PROVIDER: ${DOMAIN_PROVIDER:-simulated}
      HOSTINGER_API_TOKEN: ${HOSTINGER_API_TOKEN:-}
      MAINSPOT_DOMAIN_SUFFIX: ${MAINSPOT_DOMAIN_SUFFIX:-sim.mainspot.local}
      PREVIEW_TOKEN_TTL_MINUTES: ${PREVIEW_TOKEN_TTL_MINUTES:-1440}
    ports:
      - "${APP_PORT:-3000}:3000"
    command: ["sh", "-c", "test -n \"$JWT_SECRET\" || { echo 'FATAL: JWT_SECRET is required for the app. Generate one (openssl rand -hex 32) and set it in .env (see .env.example). There is no default secret (IR-02).'; exit 1; }; node scripts/db-setup.ts && node src/api/server.ts"]

volumes:
  mainspot_pgdata:
