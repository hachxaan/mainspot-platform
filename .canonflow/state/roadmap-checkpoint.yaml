    state: DONE
    implements: [DEC-0021, DEC-0022, DEC-0023, DEC-0024, DEC-0025, DEC-0026, DEC-0027, DEC-0014]
    summary: >-
      RetentionService (src/retention/service.ts, migración 0015): purga automática diaria desde las 03:00 UTC
      (contenido conversacional 90 días redactado conservando la estructura, propuestas abiertas caducadas,
      cuerpos Jev a NULL; auditoría y agregados 2 años), una transacción y un evento retention.purged por tenant,
