      eliminados; permiso analytics.purge → analytics.retention (vista previa). Desplegado; ejecución programada
      completada en producción (2 tenants, nada que purgar). Respaldos diarios y prueba mensual habilitados en el
      host; simulacro de no reintroducción sobre copia restaurada sin rastros.
