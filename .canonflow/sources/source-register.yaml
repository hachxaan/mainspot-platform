  kind: document
  location: .canonflow/sources/SRC-0017-governance-security-cycle-directive.md
  fingerprint: sha256:6acfea9dd4314fa24553f1c33700804a642251b5cd16e067a548aa627aa6352c
  reliability: authoritative
  registered_at: '2026-11-06'
  notes: >-
    Fuente humana literal externa al HDC (mensaje de apertura de la sesión OMP del 2026-11-05, hora local);
    registrada como DEC-0077 sin inventar QS/ANS. Enumera con palabras del propietario las siete decisiones
    comerciales confirmadas (detalle en SRC-0016) y ordena una decisión canónica nueva con precedencias explícitas
    y la implementación de SEC-CONSENT-01 y SEC-TG-APPROVAL-01. No autoriza producción, bases reales, proveedores
