# Core Skill Registry fragment — Implementation capabilities (method/20).
# Validate: schemas/skill-registry.schema.yaml. REVIEW_CANDIDATE (PROP-0006).
# repo/branch/base_sha verification run as G-REPO under canonflow-repo-worktree-auditor
# (method/21); scoped implementation, tests, evidence capture and report generation are
# the Loop 3 implementation agent (prompts/06) — governed by the skill layer, NOT skill
# cards, so their operating_role is empty; planning and remediation run under
# canonflow-implementation-planner (method/21).
schema: skill-registry/v1
registry_version: 0.2.0
level: core
category: implementation
source_sha: 9f223113af19bb74d3288e06373df995512b4ae2
coverage_notes: "G-REPO pre-flight (repo-worktree-auditor), increment planning and remediation (implementation-planner), and the four Loop-3 execution capabilities whose operating_role is empty (governed by the skill layer, not a card; executor identity gap GAP-11) which therefore carry no card checksum. SUB-02 v2 additions (DEC-0043): does_not_cover, per-entry checksum, source_sha."
does_not_cover:
  - "functional or technical canon authoring (Loops 1 and 2)"
  - "independent audit or AUD verdicts (audit fragment; no self-audit)"
  - "approving G-PLAN or any human gate"
  - "release-scope closure, merge, tag or deploy (release fragment; human acts)"
  - "publishing next_task or converting a route (routing fragment; orchestrator monopoly)"
skills:
  - schema: skill-definition/v1
    skill_id: repo_verification
    name: Repository verification
    category: implementation
    level: core
    purpose: Verify the working repository identity matches the contract/run declaration before any write (G-REPO hard stop).
    operating_role: canonflow-repo-worktree-auditor
    card_ref: skills/canonflow-repo-worktree-auditor.skill-card.yaml
    checksum: "sha256:7340feab44d75cd0e0e825ad02b257fbe9e24342db357cdbbd2fafd96f95128c"
    triggered_when:
      - "an increment contract or skill run is about to execute against a repository"
      - "a run's declared repo cannot be confirmed against the worktree remote"
    affected_loop: implementation_loop
    risk_relevance: "T0-T4; a wrong-repository write is catastrophic at any tier"
    inputs:
      - "the subject contract.yaml inputs.repo or RUN-xxxx.skill-run.yaml"
      - "git metadata at the declared worktree"
    outputs: ["repo-identity check result cited in RUN-xxxx.evidence/", "verdict contribution to the G-REPO pre-flight"]
    required_templates: []
    required_schemas: [schemas/skill-run.schema.yaml, schemas/skill-report.schema.yaml]
    required_prompts: [prompts/25-skill-repo-worktree-auditor.md]
    required_gates: [G-REPO]
    evidence_required: ["git remote/identity output captured to a file", "declared repo compared to the resolved worktree"]
    human_decision_triggers: []
    token_profile:
      reads: ["contract/run inputs pointer", "git remote metadata"]
      ignores: ["file contents", "canon", "diffs"]
      typical_cost: low
    default_effort: low
    max_effort_conditions: ["ambiguous remotes or mirrored/forked repositories"]
    failure_modes: ["writing after an unverified or mismatched repo", "trusting a declared repo without confirming the worktree"]
    related_skills: [branch_verification, base_sha_verification, scoped_implementation]
  - schema: skill-definition/v1
    skill_id: branch_verification
    name: Branch verification
