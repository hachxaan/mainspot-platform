    required_prompts: [prompts/25-skill-repo-worktree-auditor.md]
    required_gates: [G-REPO]
    evidence_required: ["git branch output captured to a file", "declared branch is a work branch, not main/master"]
    human_decision_triggers: []
    token_profile:
      reads: ["contract/run inputs pointer", "git branch metadata"]
      ignores: ["file contents", "canon", "diffs"]
      typical_cost: low
    default_effort: low
    max_effort_conditions: ["detached HEAD or ambiguous branch tracking"]
    failure_modes: ["writing on main/master (DEC-0003 violation)", "writing on a branch other than the declared work branch"]
    related_skills: [repo_verification, base_sha_verification, scoped_implementation]
  - schema: skill-definition/v1
    skill_id: base_sha_verification
    name: Base SHA verification
    category: implementation
    level: core
    purpose: Verify HEAD descends from the declared base SHA and the tree is clean or verbatim-accounted before any write (G-REPO hard stop).
    operating_role: canonflow-repo-worktree-auditor
    card_ref: skills/canonflow-repo-worktree-auditor.skill-card.yaml
    checksum: "sha256:7340feab44d75cd0e0e825ad02b257fbe9e24342db357cdbbd2fafd96f95128c"
    triggered_when:
      - "a run must confirm it is baselined on the contract/run declared base SHA"
      - "the worktree tree is dirty or HEAD does not descend from the declared base"
    affected_loop: implementation_loop
    risk_relevance: "T0-T4; a wrong base SHA silently rebases scope onto an unintended state"
    inputs:
      - "the subject contract.yaml inputs.base_sha or RUN-xxxx.skill-run.yaml"
      - "git ancestry and status metadata at the worktree"
    outputs: ["base-SHA ancestry and clean-tree check result cited in RUN-xxxx.evidence/", "verdict contribution to the G-REPO pre-flight"]
    required_templates: []
    required_schemas: [schemas/skill-run.schema.yaml, schemas/skill-report.schema.yaml]
    required_prompts: [prompts/25-skill-repo-worktree-auditor.md]
    required_gates: [G-REPO]
    evidence_required: ["git merge-base/status output captured to a file", "HEAD ancestry to the declared base SHA confirmed"]
    human_decision_triggers: []
    token_profile:
      reads: ["contract/run inputs pointer", "git ancestry and status metadata"]
      ignores: ["file contents", "canon", "diffs"]
      typical_cost: low
    default_effort: low
    max_effort_conditions: ["divergent history or unexplained dirty tree needing verbatim accounting"]
    failure_modes: ["writing from a base SHA that is not an ancestor of HEAD", "accepting a dirty tree that is not verbatim-accounted"]
    related_skills: [repo_verification, branch_verification, scoped_implementation]
  - schema: skill-definition/v1
    skill_id: increment_planning
    name: Increment planning
    category: implementation
    level: core
    purpose: Derive one-session increment contracts from APPROVED canon (scope, allowed_paths, done_criteria, tier), leave them PLANNED, and open the G-PLAN session; never implements or approves.
    operating_role: canonflow-implementation-planner
    card_ref: skills/canonflow-implementation-planner.skill-card.yaml
    checksum: "sha256:a6f817b454f7f20d8320eb5056c570b78505c093b86f9cf4efddd6b66fe744c9"
    triggered_when:
      - "both functional and technical canons are APPROVED and an increment set is not yet planned"
      - "a planning task is published in skill-state.next_task"
    affected_loop: implementation_loop
    risk_relevance: "elevated at T3-T4; public API >= T3, existing data/migrations/auth >= T4"
    inputs:
      - ".canonflow/state/method-state.yaml"
      - ".canonflow/skill-state/skill-state.yaml"
      - ".canonflow/skill-runs/index.yaml"
      - "pinned APPROVED canon pointers (versions + item ids)"
    outputs: ["INC-xxxx contracts (state PLANNED, plan_approval empty)", "G-PLAN question sessions (batched T0-1, individual Tier 2+)"]
    required_templates: [templates/implementation/increment-contract.yaml]
    required_schemas: [schemas/increment-contract.schema.yaml]
    required_prompts: [prompts/21-skill-implementation-planner.md]
    required_gates: [G-PLAN]
    evidence_required:
      - "each contract validates against schemas/increment-contract.schema.yaml"
      - "each contract traces to APPROVED canon items at pinned versions"
      - "declared tier at or above the method/12 floor for what it touches"
    human_decision_triggers: ["G-PLAN plan approval (human only)", "canon ambiguity blocking a contract"]
    token_profile:
      reads: ["state pointers", "skill-runs index", "pinned canon item ids"]
      ignores: ["full canon bodies", "code", "runtime", "unrelated increments"]
      typical_cost: medium
    default_effort: high
    max_effort_conditions: ["Tier 3-4 increments", "STALE_CANON delta analysis and re-baseline"]
    failure_modes: ["planning against non-APPROVED canon", "STALE_CANON without re-baseline", "scope creep beyond one agent session", "under-tiering a contract"]
    related_skills: [scoped_implementation, repo_verification, remediation_handling]
  - schema: skill-definition/v1
    skill_id: scoped_implementation
    name: Scoped implementation
    category: implementation
    level: core
    purpose: Execute the increment contract scope only, writing strictly inside allowed_paths — the Loop 3 implementation agent (prompts/06), governed by the skill layer, not itself a skill card.
    operating_role: ""
    checksum_note: "no operating card (operating_role empty; GAP-11 executor identity gap); no card to checksum at this index"
    triggered_when:
      - "an increment contract is at PLAN_APPROVED and its G-REPO pre-flight passed"
      - "a scoped implementation task is assigned for an approved contract"
    affected_loop: implementation_loop
    risk_relevance: "T0-T4; scope escaping allowed_paths corrupts the audit surface"
    inputs:
      - ".canonflow/increments/INC-xxxx/contract.yaml (state PLAN_APPROVED)"
      - "the pinned canon items listed in the contract"
    outputs: ["code/artifact changes on the work branch strictly within allowed_paths"]
    required_templates: []
    required_schemas: [schemas/increment-contract.schema.yaml]
    required_prompts: [prompts/06-implementation-agent.md]
    required_gates: [G-REPO]
    evidence_required: ["all changed paths fall inside contract.allowed_paths", "every assumption logged as ASSUMED in the report"]
    human_decision_triggers: ["canon ambiguity found mid-implementation (classify functional vs technical)", "scope pressure beyond the contract"]
    token_profile:
      reads: ["the one contract", "the pinned canon items in scope"]
      ignores: ["out-of-scope files", "canon outside the pinned items", "other increments"]
      typical_cost: high
    default_effort: high
    max_effort_conditions: ["Tier 3-4 changes touching public API, data or auth"]
    failure_modes: ["writing outside allowed_paths", "scope creep beyond the contract", "resolving canon ambiguity by inference instead of a Decision Console session"]
    related_skills: [test_execution, evidence_capture, implementation_report_generation]
  - schema: skill-definition/v1
