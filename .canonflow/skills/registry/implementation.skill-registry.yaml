    related_skills: [evidence_capture, test_execution, scoped_implementation]
  - schema: skill-definition/v1
    skill_id: remediation_handling
    name: Remediation handling
    category: implementation
    level: core
    purpose: Publish and scope a bounded remediation task that references only the cited blocking FND-xxxx findings (AUDIT_BLOCKED -> REMEDIATION); no scope growth without G-PLAN.
    operating_role: canonflow-implementation-planner
    card_ref: skills/canonflow-implementation-planner.skill-card.yaml
    checksum: "sha256:a6f817b454f7f20d8320eb5056c570b78505c093b86f9cf4efddd6b66fe744c9"
    triggered_when:
      - "an increment audit verdict is AUDIT_BLOCKED with blocking findings"
      - "a skill report verdict is REMEDIATION_REQUIRED with cited findings"
    affected_loop: implementation_loop
    risk_relevance: "T0-T4; scope growth during remediation reopens the whole increment"
    inputs:
      - "the audit.yaml or skill report findings (FND-xxxx ids)"
      - "the blocked increment contract.yaml"
    outputs: ["a bounded remediation task citing only the blocking FND-xxxx ids", "a re-baselined contract when the base changed"]
    required_templates: [templates/implementation/increment-contract.yaml]
    required_schemas: [schemas/increment-contract.schema.yaml]
    required_prompts: [prompts/21-skill-implementation-planner.md]
    required_gates: [G-PLAN]
    evidence_required:
      - "each remediation item maps to a cited FND-xxxx finding"
      - "no scope beyond the cited findings without a new G-PLAN approval"
    human_decision_triggers: ["remediation that would exceed the cited findings (requires G-PLAN)", "re-tiering the increment"]
    token_profile:
      reads: ["the cited findings", "the blocked contract"]
      ignores: ["the full audit narrative", "unrelated increments", "canon bodies"]
      typical_cost: medium
    default_effort: high
    max_effort_conditions: ["Tier 3-4 remediation", "re-baseline after STALE_CANON"]
    failure_modes: ["scope growth beyond the cited findings", "publishing remediation without citing the blocking findings", "silently promoting partial results of a blocked run"]
    related_skills: [increment_planning, implementation_report_generation, scoped_implementation]
