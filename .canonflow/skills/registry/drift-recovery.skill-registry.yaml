# Core Skill Registry fragment — Drift Recovery capabilities (method/20).
# Validate: schemas/skill-registry.schema.yaml. REVIEW_CANDIDATE (PROP-0006).
# Capabilities are exercised by the canonflow-drift-recovery operating role (method/21),
# the only legal path for observed reality to re-enter canon (method/05).
schema: skill-registry/v1
registry_version: 0.2.0
level: core
category: drift_recovery
source_sha: 9f223113af19bb74d3288e06373df995512b4ae2
coverage_notes: "The only legal path for observed reality (code/runtime/config/contracts) to re-enter canon: inventories seven surfaces, classifies drift, proposes R1-R5 as PROPOSED; patches only post-RECONCILIATION_DECIDED. SUB-02 v2 additions (DEC-0043): does_not_cover, per-entry checksum, source_sha."
does_not_cover:
  - "writing code or canon before RECONCILIATION_DECIDED"
  - "deciding the reconciliation direction R1-R5 (human decision via HDC)"
  - "treating runtime behavior as canon without a decision record"
  - "greenfield or brownfield canon authoring (functional and technical loops)"
  - "independent audit verdicts (audit fragment)"
skills:
  - schema: skill-definition/v1
    skill_id: documentation_inventory
    name: Documentation inventory
    category: drift_recovery
    level: core
    purpose: Fingerprint the canon documentation surfaces (S1 functional canon and S2 technical canon) so canon claims are compared against a saved fingerprint, never memory.
    operating_role: canonflow-drift-recovery
    card_ref: skills/canonflow-drift-recovery.skill-card.yaml
    checksum: "sha256:43ae614367489937e04b17497972617f2cee8e6385028eabcc002734ae6f4329"
    triggered_when:
      - "drift recovery opens or resumes a DR-xxxx and S1/S2 are not yet fingerprinted"
      - "a stale_canon cascade or audit finding names canon documentation as a compared surface"
    affected_loop: drift_runtime_recovery_mode
    risk_relevance: "T0-T4; unfingerprinted canon lets a comparison run against memory"
    inputs: ["pinned functional and technical canon index pointers", "the open recovery/DR-xxxx pointer"]
    outputs:
      - "S1_functional_canon and S2_technical_canon fingerprint entries with evidence paths in the DR-xxxx report"
    required_templates: [templates/recovery/runtime-inventory.md]
    required_schemas: [schemas/drift-report.schema.yaml]
    required_prompts: [prompts/17-skill-drift-recovery.md]
    required_gates: []
    evidence_required:
      - "a fingerprint (version plus content hash) per canon surface"
      - "a script-collected evidence file path per fingerprint"
    human_decision_triggers: []
    token_profile:
      reads: ["canon indices via pointers", "the open DR-xxxx inventory"]
      ignores: ["code", "runtime", "downstream drift items"]
      typical_cost: low
    default_effort: low
    max_effort_conditions: ["large multi-slice canon requiring a sampling strategy"]
    failure_modes:
      - "canon compared from memory instead of a saved fingerprint"
      - "absent canon treated as a match rather than an EVIDENCE_GAP signal"
    related_skills: [repo_inventory, drift_classification, recovery_evidence_capture]
