  - schema: skill-definition/v1
    skill_id: drift_classification
    name: Drift classification
    category: drift_recovery
    level: core
    purpose: Turn each divergence into a DI-xxxx item with exactly one drift_class (DOC_AHEAD_OF_CODE, CODE_AHEAD_OF_CANON, RUNTIME_AHEAD_OF_CODE, CONFIG_DRIFT, PUBLISHED_CONTRACT_DRIFT, EVIDENCE_GAP, UNKNOWN_ORIGIN), a severity tier and the surfaces involved.
    operating_role: canonflow-drift-recovery
    card_ref: skills/canonflow-drift-recovery.skill-card.yaml
    checksum: "sha256:43ae614367489937e04b17497972617f2cee8e6385028eabcc002734ae6f4329"
    triggered_when:
      - "surfaces are fingerprinted and divergence signals or comparisons exist to classify"
      - "the drift report is at DRIFT_INVENTORY and needs DRIFT_CLASSIFIED items"
    affected_loop: drift_runtime_recovery_mode
    risk_relevance: "T0-T4; under-tiering or misclassification derails reconciliation"
    inputs: ["fingerprinted surface evidence pointers", "divergence and comparison signal pointers", "the open recovery/DR-xxxx pointer"]
    outputs:
      - "DI-xxxx drift items carrying drift_class severity_tier and surfaces at DRIFT_CLASSIFIED"
    required_templates: [templates/recovery/drift-report.yaml]
    required_schemas: [schemas/drift-report.schema.yaml]
    required_prompts: [prompts/17-skill-drift-recovery.md]
    required_gates: []
    evidence_required:
      - "every DI-xxxx cites its surfaces and the compared evidence fingerprints"
      - "a severity tier assigned per item per the method/12 tier semantics"
    human_decision_triggers: []
    token_profile:
      reads: ["surface fingerprints and divergence signals", "the drift report skeleton"]
      ignores: ["full source files", "unrelated surfaces"]
      typical_cost: medium
    default_effort: high
    max_effort_conditions: ["Tier 3-4 divergences or ambiguous UNKNOWN_ORIGIN attribution"]
    failure_modes:
      - "a divergence forced into a class it does not fit instead of UNKNOWN_ORIGIN"
      - "under-tiering a security/data/migration divergence below its true tier"
      - "canon or code edited during classification (no write before RECONCILIATION_DECIDED)"
    related_skills: [api_contract_comparison, reconciliation_planning, recovery_evidence_capture]
  - schema: skill-definition/v1
    skill_id: reconciliation_planning
    name: Reconciliation planning
    category: drift_recovery
    level: core
    purpose: Propose exactly one reconciliation direction per drift item (R1_UPDATE_CANON, R2_FIX_REALITY, R3_SPLIT, R4_DEPRECATE, R5_ACCEPT_RISK) as PROPOSED and generate a Human Decision Console session — individual per Tier >= 2 item, batchable for Tier 0-1.
    operating_role: canonflow-drift-recovery
    card_ref: skills/canonflow-drift-recovery.skill-card.yaml
    checksum: "sha256:43ae614367489937e04b17497972617f2cee8e6385028eabcc002734ae6f4329"
    triggered_when:
      - "the drift report is DRIFT_CLASSIFIED and has no reconciliation directions yet"
      - "reconciliation must move from RECONCILIATION_PROPOSED toward a human decision"
    affected_loop: drift_runtime_recovery_mode
    risk_relevance: "T0-T4; the chosen direction governs whether canon or reality changes"
    inputs: ["classified DI-xxxx item pointers", "the reconciliation-plan template pointer", "decision-state pointers"]
    outputs:
      - "reconciliation-plan.md with one PROPOSED R1-R5 direction per item plus a QS session"
    required_templates: [templates/recovery/reconciliation-plan.md, templates/decision-console/question-session.json]
    required_schemas: [schemas/drift-report.schema.yaml, schemas/question-session.schema.yaml]
    required_prompts: [prompts/17-skill-drift-recovery.md, prompts/12-question-session-generator.md]
    required_gates: []
    evidence_required:
      - "one PROPOSED direction with a rationale per DI-xxxx"
      - "a QS session exists for every Tier >= 2 item before any recovery work"
      - "each R5 proposal carries a proposed owner and an expiry"
    human_decision_triggers:
      - "every Tier >= 2 drift item (individual RECONCILIATION_DECIDED)"
      - "any R5 accept-risk proposal (RSK-xxxx with owner and expiry)"
      - "promoting runtime behavior into canon via R1 (runtime is never canon without a decision record)"
    token_profile:
      reads: ["classified drift items", "decision-state/latest.json"]
      ignores: ["full surface evidence", "source code", "runtime internals"]
      typical_cost: medium
    default_effort: high
    max_effort_conditions: ["Tier 3-4 items or split (R3) reconciliations spanning multiple loops"]
    failure_modes:
      - "writing canon or code before RECONCILIATION_DECIDED closes the session"
      - "a direction chosen by inference instead of a human decision for a Tier >= 2 item"
      - "an R5 accepted with no owner or no expiry"
    related_skills: [drift_classification, question_session_generation, decision_record_generation]
  - schema: skill-definition/v1
    skill_id: recovery_evidence_capture
    name: Recovery evidence capture
    category: drift_recovery
    level: core
    purpose: Script-collect and store the fingerprints, comparisons and decision references of a recovery run as immutable evidence files, then confirm a clean seven-surface re-comparison before RECOVERED.
    operating_role: canonflow-drift-recovery
    card_ref: skills/canonflow-drift-recovery.skill-card.yaml
    checksum: "sha256:43ae614367489937e04b17497972617f2cee8e6385028eabcc002734ae6f4329"
    triggered_when:
      - "a recovery run produces fingerprints, comparisons or decision references needing durable evidence"
      - "recovery reaches RECOVERY_IN_PROGRESS or RECOVERED and the seven-surface re-comparison must be captured"
    affected_loop: drift_runtime_recovery_mode
    risk_relevance: "T0-T4; recovery closure and audit depend on complete cited evidence"
    inputs: ["surface fingerprint and comparison output pointers", "DEC/RSK decision reference pointers", "the open recovery/DR-xxxx pointer"]
    outputs:
      - "immutable evidence files cited by path from DI-xxxx items and a clean re-comparison record"
    required_templates: [templates/recovery/drift-report.yaml]
    required_schemas: [schemas/drift-report.schema.yaml, schemas/skill-report.schema.yaml]
    required_prompts: [prompts/17-skill-drift-recovery.md]
    required_gates: [G-EVID]
    evidence_required:
      - "every DI-xxxx and surface fingerprint resolves to a stored evidence file path"
      - "a saved clean seven-surface re-comparison before any RECOVERED claim"
      - "no Tier >= 3 UNKNOWN_ORIGIN item left open at close"
    human_decision_triggers: []
    token_profile:
      reads: ["fingerprint and comparison outputs", "decision references", "the drift report index"]
      ignores: ["raw source files", "chat history", "unrelated runs"]
      typical_cost: low
    default_effort: medium
    max_effort_conditions: ["large recovery with many surfaces and decision records to reconcile"]
    failure_modes:
