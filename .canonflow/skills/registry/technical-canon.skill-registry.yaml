# Core Skill Registry fragment — Technical Canon capabilities (method/20).
# Validate: schemas/skill-registry.schema.yaml. REVIEW_CANDIDATE (PROP-0006).
# Capabilities are exercised by the canonflow-technical-canon operating role (method/21);
# technical_review runs in its reviewer mode. Every capability DERIVES_FROM a pinned
# FUNCTIONAL_CANON_APPROVED version (G-DER, no invented scope); nothing downstream redefines upstream.
schema: skill-registry/v1
registry_version: 0.2.0
level: core
category: technical_canon
source_sha: 9f223113af19bb74d3288e06373df995512b4ae2
coverage_notes: "Loop 2 technical-canon derivation (builder + independent reviewer) from a pinned APPROVED functional canon; reviewer ceiling is TECHNICAL_CANON_REVIEW_CANDIDATE. SUB-02 v2 additions (DEC-0043): does_not_cover, per-entry checksum, source_sha."
does_not_cover:
  - "functional requirement, acceptance-criteria or business-rule extraction (functional_canon, Loop 1)"
  - "redefining or editing the upstream functional canon"
  - "implementation or test execution (implementation loop)"
  - "moving canon to APPROVED or granting G-TEC (human only)"
  - "actual security testing, penetration testing or runtime security verification (it models security; it does not test it)"
