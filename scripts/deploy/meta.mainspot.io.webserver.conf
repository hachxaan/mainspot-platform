# meta.mainspot.io -> contenedor wireguard-telegram (proxy interno 10.13.247.77:8080)
#   -> túnel WireGuard -> MainSpot en la máquina Starlink (10.77.0.2:8080 -> Express 127.0.0.1:3100).
# Destino: /etc/nginx/sites-available/meta.mainspot.io en el contenedor `webserver` del KVM.
# Solo se publica GET /api/connections/meta/callback: el retorno de Facebook Login al conectar la Página
# de un negocio (el navegador vuelve después al panel local). El resto devuelve 404.

# Sin query string en el log: el retorno de Facebook trae un code y un state de un solo uso.
log_format meta_oauth '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meta.mainspot.io;

    ssl_certificate /etc/letsencrypt/live/meta.mainspot.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meta.mainspot.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/meta.mainspot.io.access.log meta_oauth;
    error_log /var/log/nginx/meta.mainspot.io.error.log crit;
    client_max_body_size 16k;

    location = /api/connections/meta/callback {
        limit_except GET { deny all; }

        proxy_pass http://10.13.247.77:8080;
        include snippets/proxy-headers.conf;
        # Túnel caído: fallar rápido; la persona vuelve a pulsar «Conectar» en el panel.
        proxy_connect_timeout 5s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name meta.mainspot.io;
    server_tokens off;
    access_log /var/log/nginx/meta.mainspot.io.access.log meta_oauth;
    return 301 https://$host$request_uri;
}
