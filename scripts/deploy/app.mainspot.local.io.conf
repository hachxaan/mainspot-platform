# MainSpot — entorno de DESARROLLO (https://app.mainspot.local.io), LXC webserver 10.209.99.101.
# Upstream: Express de MainSpot en el HOST, puerto interno 3100, alcanzable desde este LXC por la
# IP del host en lxdbr0 (10.209.99.1). 127.0.0.1 dentro del LXC NO es el host.
# Certificado: CA local mkcert del host (ya confiable en el almacén del sistema y NSS del host).
# Bootstrap único (DEV-E2E-03, scripts/dev-domain-bootstrap.sh); el arranque diario no lo toca.
# Sin `http2`: en nginx 1.18 ese parámetro se aplica a todo el socket *:443 (cambiaría el protocolo
# de los demás sitios) y, ante un cambio de red del host (ERR_NETWORK_CHANGED), Chrome cierra la
# sesión HTTP/2 entera con todas sus peticiones en curso.
server {
    listen 80;
    listen [::]:80;
    server_name app.mainspot.local.io;
    return 301 https://app.mainspot.local.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.mainspot.local.io;

    ssl_certificate     /etc/nginx/ssl/app.mainspot.local.io.pem;
    ssl_certificate_key /etc/nginx/ssl/app.mainspot.local.io-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Solo el host de desarrollo (bridge lxdbr0) y loopback.
    allow 10.209.99.1;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/app.mainspot.local.io.access.log;
    error_log  /var/log/nginx/app.mainspot.local.io.error.log;

    location / {
        proxy_pass http://10.209.99.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host app.mainspot.local.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host app.mainspot.local.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
