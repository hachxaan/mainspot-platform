# MainSpot HDC — local-only HTTPS in LXC webserver (10.209.99.101).
# Existing pattern: develop.local.marketplace.dashboard.com.conf.
# LXD device mainspot-hdc, bind=container, maps container 127.0.0.1:8765
# to HOST 127.0.0.1:8765; no HDC listener on bridge/LAN/VPN.
# HDC remains unchanged: loopback Host + Origin checks and CSRF stay enabled.
map $http_origin $mainspot_hdc_upstream_origin {
    default                    "";
    "https://mainspot.hdc.com" "http://127.0.0.1:8765";
}
map $http_origin $mainspot_hdc_origin_rejected {
    default                    1;
    ""                         0;
    "https://mainspot.hdc.com" 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name mainspot.hdc.com;
    return 301 https://mainspot.hdc.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mainspot.hdc.com;

    ssl_certificate     /etc/ssl/certs/mainspot.hdc.com.crt;
    ssl_certificate_key /etc/ssl/private/mainspot.hdc.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HDC has no network login: preserve its host-only access boundary.
    allow 10.209.99.1;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    if ($mainspot_hdc_origin_rejected) { return 403; }

    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/mainspot.hdc.com.access.log;
    error_log  /var/log/nginx/mainspot.hdc.com.error.log;

    # The private instance-control channel is not a browser/proxy API.
    location ^~ /_control/ { return 404; }

    # UI-only override: the CanonFlow HDC frontend with the .canonflow-updates
    # patch stack HDC-0003..HDC-0005 applied, byte-identical to
    # scripts/deploy/hdc-ui/. The byte-pinned CanonFlow package stays untouched;
    # /api is still the pinned backend. Headers mirror the backend's (§14).
    location = / {
        root /var/www/mainspot-hdc-ui;
        try_files /index.html =404;
        default_type text/html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /css/ {
        root /var/www/mainspot-hdc-ui;
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /js/ {
        root /var/www/mainspot-hdc-ui;
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:8765";
        proxy_set_header Origin $mainspot_hdc_upstream_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "mainspot.hdc.com";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
