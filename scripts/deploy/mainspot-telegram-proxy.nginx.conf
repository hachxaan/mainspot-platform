# Dedicated nginx instance: never includes the host's unrelated sites.
worker_processes 1;
user www-data;
pid /run/mainspot-telegram-proxy/nginx.pid;
# Request-bearing error messages can contain attacker-supplied secrets.
error_log /dev/null;

events {
    worker_connections 256;
}

http {
    # No URI, query string, header or body is logged.
    log_format telegram_status '$time_iso8601 $remote_addr $request_method $status $request_time';
    access_log /var/log/mainspot-telegram-proxy/access.log telegram_status;
    server_tokens off;
    limit_conn_zone $binary_remote_addr zone=telegram_peer:64k;

    client_max_body_size 100k;
    client_body_buffer_size 100k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 5s;
    reset_timedout_connection on;

    server {
        listen 10.77.0.2:8080 default_server;
        server_name _;
        limit_conn telegram_peer 16;
        limit_conn_status 429;

        location = /telegram/webhook {
            allow 10.77.0.1;
            deny all;
            if ($request_method != POST) { return 405; }

            proxy_pass http://127.0.0.1:3100/api/telegram/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_buffering off;
            # Telegram owns retries; do not replay an ambiguous request.
            proxy_next_upstream off;
        }

        location / {
            return 404;
        }
    }
}
