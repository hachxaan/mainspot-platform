<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CanonFlow — Human Decision Console</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Skip to content</a>

  <header class="masthead" role="banner">
    <div class="masthead-inner">
      <a class="brand" href="#/overview" aria-label="CanonFlow Human Decision Console">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect x="6" y="6" width="20" height="20" rx="3" transform="rotate(45 16 16)" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <rect x="11.5" y="11.5" width="9" height="9" rx="1.5" transform="rotate(45 16 16)" fill="currentColor"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">CanonFlow</span>
          <span class="brand-product" data-i18n="app_name">Human Decision Console</span>
        </span>
      </a>
      <span class="brand-project" id="project-name" hidden></span>
      <div class="masthead-meta">
        <span id="conn-status" class="status-pill" data-state="init" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span><span class="status-text" data-i18n="conn_init">Connecting…</span>
        </span>
        <span id="generation-chip" class="gen-chip" hidden></span>
        <div class="lang-toggle" role="group" aria-label="Language" data-i18n-aria="language">
          <button type="button" class="lang-option" data-lang="es" aria-pressed="false" lang="es">ES</button>
          <button type="button" class="lang-option" data-lang="en" aria-pressed="true" lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" aria-label="Primary" data-i18n-aria="nav_primary">
      <ul class="rail-nav">
        <li><a class="rail-link" href="#/overview" data-route="overview">
          <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
          <span class="rail-label" data-i18n="nav_overview">Overview</span>
        </a></li>
        <li><a class="rail-link" href="#/decisions" data-route="decisions">
          <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 13.5l2.6-7.2A2 2 0 0 1 8 5h8a2 2 0 0 1 1.9 1.3l2.6 7.2V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z"/><path d="M3.5 13.5h4.6l1.4 2.5h5l1.4-2.5h4.6"/></svg>
          <span class="rail-label" data-i18n="nav_decisions">Decisions</span>
          <span class="rail-count" data-count="decisions" hidden></span>
        </a></li>
        <li><a class="rail-link" href="#/history" data-route="history">
          <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span class="rail-label" data-i18n="nav_history">History</span>
        </a></li>
        <li><a class="rail-link" href="#/traceability" data-route="traceability">
          <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.5 6h7M7.3 8.2l3.5 7.6M16.7 8.2l-3.5 7.6"/></svg>
          <span class="rail-label" data-i18n="nav_traceability">Traceability</span>
        </a></li>
        <li><a class="rail-link" href="#/project-state" data-route="project-state">
          <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8z"/><path d="M3.5 12.5l8.5 4.5 8.5-4.5"/><path d="M3.5 16.5l8.5 4.5 8.5-4.5"/></svg>
          <span class="rail-label" data-i18n="nav_state">Project state</span>
        </a></li>
        <li><a class="rail-link" href="#/diagnostics" data-route="diagnostics">
          <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>
          <span class="rail-label" data-i18n="nav_diagnostics">Diagnostics</span>
          <span class="rail-count rail-count--warn" data-count="diagnostics" hidden></span>
        </a></li>
      </ul>
      <div class="rail-foot" id="rail-foot"></div>
    </nav>

    <main id="main" class="main" tabindex="-1">
      <div id="conn-banner" class="conn-banner" hidden></div>
      <div id="view" class="view">
        <div class="page-loading" role="status"><span class="spinner" aria-hidden="true"></span><span data-i18n="loading">Loading…</span></div>
      </div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
